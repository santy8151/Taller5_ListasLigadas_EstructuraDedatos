<script>
class Node {
  constructor(data) {
    this.data = data;
    this.next = null;
    this.prev = null;
  }
}

class DoublyLinkedList {
  constructor(compare) {
    this.compare = compare;
    this.head = null;
    this.tail = null;
    this.count = 0;
    this.descending = false;
  }

  compareOrder(a, b) {
    return this.descending ? this.compare(b, a) : this.compare(a, b);
  }

  add(data) {
    const newNode = new Node(data);

    if (this.head === null) {
      this.head = newNode;
      this.tail = newNode;
      this.count++;
      return;
    }

    let current = this.head;
    while (current !== null && this.compareOrder(data, current.data) >= 0) {
      current = current.next;
    }

    if (current === null) {
      this.tail.next = newNode;
      newNode.prev = this.tail;
      this.tail = newNode;
    } else {
      newNode.next = current;
      newNode.prev = current.prev;

      if (current.prev !== null) current.prev.next = newNode;
      else this.head = newNode;

      current.prev = newNode;
    }
    this.count++;
  }

  showForward() {
    if (this.head === null) return "The list is empty.";
    const parts = [];
    for (let n = this.head; n !== null; n = n.next) parts.push(n.data);
    return parts.join(", ");
  }

  showBackward() {
    if (this.tail === null) return "The list is empty.";
    const parts = [];
    for (let n = this.tail; n !== null; n = n.prev) parts.push(n.data);
    return parts.join(", ");
  }

  sortDescending() {
    if (this.descending || this.count < 2) {
      this.descending = true;
      return;
    }

    let current = this.head;
    while (current !== null) {
      const temp = current.next;
      current.next = current.prev;
      current.prev = temp;
      current = current.prev;
    }

    const aux = this.head;
    this.head = this.tail;
    this.tail = aux;

    this.descending = true;
  }

  getOccurrences() {
    const result = [];
    for (let n = this.head; n !== null; n = n.next) {
      const last = result[result.length - 1];
      if (last && this.compare(last.value, n.data) === 0) last.times++;
      else result.push({ value: n.data, times: 1 });
    }
    return result;
  }

  showModes() {
    if (this.head === null) return "The list is empty.";

    const occurrences = this.getOccurrences();
    const max = Math.max(...occurrences.map(o => o.times));
    const modes = occurrences.filter(o => o.times === max).map(o => o.value);

    if (modes.length === 1) return `The mode is ${modes[0]}.`;

    const start = modes.slice(0, -1).join(", ");
    return `The modes are ${start} and ${modes[modes.length - 1]}.`;
  }

  showGraph() {
    if (this.head === null) return "The list is empty.";
    return this.getOccurrences()
      .map(o => `${o.value} ${"*".repeat(o.times)}`)
      .join("\n");
  }

  findNode(data) {
    for (let n = this.head; n !== null; n = n.next) {
      if (this.compare(n.data, data) === 0) return n;
    }
    return null;
  }

  exists(data) {
    return this.findNode(data) !== null;
  }

  unlinkNode(node) {
    if (node.prev !== null) node.prev.next = node.next;
    else this.head = node.next;

    if (node.next !== null) node.next.prev = node.prev;
    else this.tail = node.prev;

    this.count--;
  }

  removeOne(data) {
    const node = this.findNode(data);
    if (node === null) return false;
    this.unlinkNode(node);
    return true;
  }

  removeAll(data) {
    let removed = 0;
    let current = this.head;
    while (current !== null) {
      const next = current.next;
      if (this.compare(current.data, data) === 0) {
        this.unlinkNode(current);
        removed++;
      }
      current = next;
    }
    return removed;
  }
}
